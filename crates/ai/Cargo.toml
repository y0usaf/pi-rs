[package]
name = "pi-ai"
description = "Pi's pi-ai: one streaming interface over LLM provider APIs, with Pi's model catalog, request and event shapes, and OAuth logins."
version = "0.1.0"
edition = "2024"
license = "MIT"
exclude = ["/parity"]

[dependencies]
pi-rt = { path = "../rt" }
pi-chord = { path = "../chord" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
ring = { version = "0.17", optional = true }

[features]
default = []
http = ["dep:rustls", "dep:webpki-roots", "dep:ring"]
anthropic = ["http"]
openai = ["http"]
vercel-gateway = ["anthropic"]
providers = ["anthropic", "openai", "vercel-gateway"]

[[example]]
name = "oauth_flow"
required-features = ["anthropic"]

[[example]]
name = "parity_ai"
required-features = ["providers"]
