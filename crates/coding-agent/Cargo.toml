[package]
name = "pi-coding-agent"
description = "Pi's coding agent on pi-durable: settings, credentials, model resolution, the system prompt, the built-in tools, print mode and the interactive mode."
version = "0.1.0"
edition = "2024"
license = "MIT"
exclude = ["/parity"]

[[bin]]
name = "pi-rs"
path = "src/main.rs"

[dependencies]
pi-codemode = { path = "../codemode" }
pi-durable = { path = "../durable", features = ["providers"] }
pi-mcp = { path = "../mcp" }
pi-extensions = { path = "../extensions" }
pi-tui = { path = "../tui" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
unicode-normalization = "0.1"
ring = "0.17"
libc = "0.2"

[dev-dependencies]
vt100 = "0.18.1"
