[package]
name = "pi-durable"
description = "Durable conversations, tasks and documents over a transactional store, with a synchronous agent harness: a Rust reproduction of Pi's pi-durable."
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
keywords = ["llm", "agent", "durable", "sqlite", "anthropic"]
categories = ["database", "api-bindings"]
exclude = ["/parity"]

[dependencies]
pi-rt = { path = "../rt" }
pi-chord = { path = "../chord" }
pi-env = { path = "../env" }
pi-ai = { path = "../ai" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }

[features]
default = []
http = ["pi-ai/http"]
anthropic = ["http", "pi-ai/anthropic"]
openai = ["http", "pi-ai/openai"]
vercel-gateway = ["anthropic", "pi-ai/vercel-gateway"]
providers = ["anthropic", "openai", "vercel-gateway", "pi-ai/providers"]

[[example]]
name = "agent"
required-features = ["providers"]

[[example]]
name = "provider_e2e"
required-features = ["anthropic"]

[[example]]
name = "openai_responses_e2e"
required-features = ["openai"]

[[example]]
name = "openai_completions_e2e"
required-features = ["openai"]
