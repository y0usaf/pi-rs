[package]
name = "pi-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]

[dependencies]
async-channel = "2"
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a" }
gpui-platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a" }
pi-durable = { path = "../../crates/durable", features = ["providers"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
